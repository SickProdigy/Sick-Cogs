<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Session · SickGaming</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">SickGaming Crypto Wallet</p>
    <h1>Protected wallet session</h1>
    <p id="session-status">Loading verified session details…</p>
    <dl id="session-details" hidden></dl>
    <div id="claim-controls" hidden>
      <button id="claim-wallet" type="button">Claim this wallet</button>
      <p id="claim-status" role="status"></p>
    </div>
    <p class="notice">Identity verification does not sign or broadcast a transaction.</p>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
